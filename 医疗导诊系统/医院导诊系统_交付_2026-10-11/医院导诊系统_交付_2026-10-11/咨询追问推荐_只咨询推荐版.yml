          : [\"内科\", \"全科\"],\n    \"digestive\": [\"消化\", \"胃肠\"],\n    \"respiratory\": [\"呼吸\", \"肺\"],\n    \"neurology\"\
          : [\"神经\", \"脑血管\", \"头痛\", \"癫痫\"],\n    \"orthopedic\": [\"骨科\", \"关节\", \"脊柱\", \"创伤\"],\n    \"gynecology\"\
          : [\"妇产\", \"产科\", \"妇科\"],\n    \"pediatrics\": [\"儿科\", \"儿童\", \"儿保\"],\n    \"ent\": [\"耳鼻喉\", \"耳\", \"鼻\"\
          , \"咽喉\"],\n    \"dermatology\": [\"皮肤\", \"皮疹\"],\n    \"endocrine\": [\"内分泌\", \"糖尿\", \"甲状腺\"],\n    \"cardiac\"\
          : [\"心血管\", \"心内\"],\n    \"surgery\": [\"外科\", \"普外\", \"泌尿\"],\n}\n\n\ndef doctor_line(doc: dict) -> str:\n  \
          \  parts = [str(doc.get(\"hospital_name\") or \"\"), str(doc.get(\"department_name\") or \"\"), str(doc.get(\"name\"\
          ) or \"\")]\n    line = \" · \".join(part for part in parts if part)\n    title = str(doc.get(\"title\") or \"\"\
          )\n    specialty = str(doc.get(\"specialty\") or \"\")\n    if title or specialty:\n        suffix = \"，\".join(item\
          \ for item in [title, \"擅长\" + specialty if specialty else \"\"] if item)\n        line += \"（\" + suffix + \"）\"\
          \n    return line\n\n\ndef main(text: str, context: str, options_body: str) -> dict:\n    source = json.loads(context)\n\
          \    state = source.get(\"state\", {})\n    clinical = dict(source.get(\"result\", state.get(\"clinical_result\"\
          , {})))\n    state[\"clinical_result\"] = dict(clinical)\n    state[\"recommend_started\"] = True\n    result =\
          \ dict(clinical)\n    result[\"schema_version\"] = \"2.0\"\n    result[\"questions\"] = []\n    result[\"recommended_doctors\"\
          ] = []\n    catalog = {}\n    answer = \"\"\n    try:\n        changes = json.loads(text)\n        if not isinstance(changes,\
          \ dict):\n            raise ValueError(\"偏好格式不正确\")\n        catalog = json.loads(options_body)\n        doctors\
          \ = list(catalog.get(\"doctors\") or [])\n        specialty = result.get(\"specialty_code\", state.get(\"specialty_code\"\
          , \"general\"))\n        prefs = dict(state.get(\"preferences\", {}))\n        if changes.get(\"registration_type\"\
          ) in {\"expert\", \"ordinary\", \"any\"}:\n            prefs[\"registration_type\"] = changes[\"registration_type\"\
          ]\n        doctor = changes.get(\"doctor_id\")\n        doctor_ids = {doc.get(\"id\") for doc in doctors}\n    \
          \    if isinstance(doctor, int) and not isinstance(doctor, bool):\n            if doctor == 0:\n               \
          \ prefs.pop(\"doctor_id\", None)\n            elif doctor in doctor_ids:\n                prefs[\"doctor_id\"] =\
          \ doctor\n        state[\"preferences\"] = prefs\n        result[\"preferences\"] = prefs\n        keywords = KEYWORDS.get(specialty,\
          \ KEYWORDS[\"general\"])\n        matched = []\n        for doc in doctors:\n            haystack = str(doc.get(\"\
          specialty\") or \"\") + \" \" + str(doc.get(\"department_name\") or \"\")\n            if any(keyword in haystack\
          \ for keyword in keywords):\n                matched.append(doc)\n        if prefs.get(\"doctor_id\"):\n       \
          \     picked = [doc for doc in matched if doc.get(\"id\") == prefs[\"doctor_id\"]]\n            if picked:\n   \
          \             matched = picked\n            else:\n                answer = \"您指定的医生不在推荐科室里，请换一位或让我列出可选医生。\"\n \
          \               matched = []\n        if not answer:\n            if prefs.get(\"registration_type\") == \"expert\"\
          :\n                experts = [doc for doc in matched if \"主任\" in str(doc.get(\"title\") or \"\")]\n           \
          \     matched = experts or matched\n            elif prefs.get(\"registration_type\") == \"ordinary\":\n       \
          \         ordinary = [doc for doc in matched if \"主治\" in str(doc.get(\"title\") or \"\") or \"住院\" in str(doc.get(\"\
          title\") or \"\")]\n                matched = ordinary or matched\n        matched = matched[:3]\n        result[\"\
          recommended_doctors\"] = matched\n        department = LABELS.get(specialty, \"全科门诊\")\n        result[\"department_recommendation\"\
          ] = department\n        intro = \"建议挂\" + department + \"。\"\n        if specialty == \"general\":\n           \
          \ intro = \"暂时难判断具体科室，建议先挂全科门诊，再由医生分诊。\"\n        if not answer:\n            if matched:\n                lines\
          \ = [doctor_line(doc) for doc in matched]\n                answer = intro + \"可考虑的医生：\" + \"；\".join(lines) + \"\
          。本服务不直接挂号，请通过医院公众号、挂号平台或窗口办理。\"\n            else:\n                answer = intro + \"目前没有检索到对口医生，请到医院导诊台或挂号平台查询。\"\
          \n        result[\"stage\"] = \"recommend\"\n    except (ValueError, KeyError, TypeError):\n        result.update(stage=\"\
          fallback\", recommended_doctors=[])\n        answer = \"暂时查不到医生名单，请稍后再试或联系导诊台。\"\n    state[\"phase\"] = \"booking_preferences\"\
          \n    state[\"stage\"] = result.get(\"stage\", \"recommend\")\n    envelope = {\"answer\": answer, \"result\": result,\
          \ \"state\": state, \"model_output\": {\"clinical\": source.get(\"model_output\", \"\"), \"booking\": text}, \"\
          knowledge\": source.get(\"knowledge\", \"\"), \"availability\": catalog}\n    return {\"envelope\": json.dumps(envelope,\
          \ ensure_ascii=False)}\n"
