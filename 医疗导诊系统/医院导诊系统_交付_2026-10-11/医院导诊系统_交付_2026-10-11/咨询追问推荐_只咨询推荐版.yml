          \    source = json.loads(envelope)\n    result = source[\"result\"]\n    state = source[\"state\"]\n    transcript\
          \ = list(state.get(\"transcript\", []))[-49:]\n    transcript.append({\"question\": query, \"answer\": source[\"\
          answer\"]})\n    state[\"transcript\"] = transcript\n    lines = []\n    for index, turn in enumerate(transcript,\
          \ 1):\n        lines.append(\"【第\" + str(index) + \"轮】患者：\" + str(turn[\"question\"]))\n        if turn.get(\"answer\"\
          ):\n            lines.append(\"【第\" + str(index) + \"轮】回复：\" + str(turn[\"answer\"]))\n    record = {\n        \"\
          event_id\": run_id,\n        \"conversation_id\": conversation_id,\n        \"user_id\": user_id,\n        \"text\"\
          : \"\\n\".join(lines),\n    }\n    return {\"body\": json.dumps(record, ensure_ascii=False), \"envelope\": json.dumps(source,\
          \ ensure_ascii=False)}\n"
