    - data:
        code: "import json\nimport re\n\nALLOWED = {\"general\", \"digestive\", \"respiratory\", \"neurology\", \"orthopedic\"\
          , \"gynecology\", \"pediatrics\", \"ent\", \"dermatology\", \"endocrine\", \"cardiac\", \"surgery\"}\n\n\ndef main(text:\
          \ str, context: str, rounds: float, knowledge: str) -> dict:\n    previous = json.loads(context)\n    state = dict(previous)\n\
          \    state.update(history=previous.get(\"history\", []), asked=list(previous.get(\"asked\", []))[-9:], phase=\"\
          clinical\")\n    count = int(rounds or 0)\n    result = {\"schema_version\": \"1.0\", \"stage\": \"fallback\", \"\
          summary\": \"目前的信息还不够判断该挂什么科\", \"questions\": [], \"recommended_doctors\": [], \"knowledge_ids\": [], \"message\"\
          : \"暂时没法根据这些信息判断该挂什么科，建议到医院导诊台咨询，或先挂全科门诊。\"}\n    try:\n        cleaned = re.sub(r\"<think>.*?</think>\", \"\",\
          \ text, flags=re.S).strip()\n        if cleaned.startswith(\"```\"):\n            cleaned = cleaned.split(\"\\n\"\
          , 1)[1].rsplit(\"```\", 1)[0]\n        model = json.loads(cleaned)\n        if not isinstance(model, dict):\n  \
          \          raise ValueError(\"Expected object\")\n        fields = model.get(\"profile\")\n        if not isinstance(fields,\
          \ dict) or model.get(\"urgency\") not in [\"emergency\", \"urgent\", \"routine\", \"undetermined\"]:\n         \
          \   raise ValueError(\"Invalid profile or urgency\")\n        age = fields.get(\"age\")\n        if isinstance(age,\
          \ str) and re.fullmatch(r\"\\d{1,3}(?:岁)?\", age.strip()):\n            age = int(age.strip().removesuffix(\"岁\"\
          ))\n            fields[\"age\"] = age\n        if age is not None and (isinstance(age, bool) or not isinstance(age,\
          \ (int, float)) or not 0 <= age <= 120):\n            raise ValueError(\"Invalid age\")\n        specialty = model.get(\"\
          specialty_code\", \"general\")\n        if specialty not in ALLOWED:\n            specialty = \"general\"\n    \
          \    ids = set(re.findall(r\"K\\d{2}\", knowledge))\n        cited = [value for value in model.get(\"knowledge_ids\"\
          , []) if value in ids]\n        summary = str(model.get(\"summary\", \"\"))[:500]\n        if not summary:\n   \
          \         raise ValueError(\"Missing summary\")\n        urgency = model[\"urgency\"]\n        red_flags = fields.get(\"\
          red_flags_status\", \"unknown\")\n        if red_flags not in [\"present\", \"absent\", \"unknown\"]:\n        \
          \    red_flags = \"unknown\"\n        if red_flags == \"absent\" and previous.get(\"history\"):\n            history\
          \ = \"。\".join(str(item) for item in previous[\"history\"])\n            explicit_negative = bool(re.search(r\"\
          (?:没有|否认|不伴|无).{0,100}(?:胸痛|呼吸困难|气促|晕|出血|剧烈|危险|上述|这些)\", history))\n            answered_screening = bool(previous.get(\"\
          asked\") and re.search(r\"(?:上述|这些|危险).{0,10}(?:都没有|没有|均无)\", history))\n            retained_negative = previous.get(\"\
          profile\", {}).get(\"red_flags_status\") == \"absent\"\n            if not (explicit_negative or answered_screening\
          \ or retained_negative):\n                red_flags = \"unknown\"\n                fields[\"red_flags_status\"]\
          \ = \"unknown\"\n        state.update(profile=fields, summary=summary, specialty_code=specialty)\n        questions\
          \ = [str(question)[:60] for question in model.get(\"questions\", []) if isinstance(question, str) and question.strip()][:2]\n\
          \        questions = list(dict.fromkeys(questions))\n        confidence = model.get(\"department_confidence\", \"\
          medium\")\n        if confidence not in [\"high\", \"medium\", \"low\"]:\n            confidence = \"low\"\n   \
          \     complaint = str(fields.get(\"main_symptom\") or \"\").strip()\n        clear_direction = specialty != \"general\"\
          \ and confidence in [\"high\", \"medium\"] and complaint not in [\"\", \"unknown\", \"未知\", \"不详\", \"不舒服\", \"\
          身体不舒服\", \"未提供\"]\n        purpose = model.get(\"question_purpose\", \"none\")\n        duration = str(fields.get(\"\
          duration\") or \"unknown\").strip().lower()\n        duration_unknown = duration in [\"\", \"unknown\", \"未知\",\
          \ \"不详\", \"未提供\"]\n        duration_asked = any(re.search(r\"多久|多长时间|什么时候|几天\", item) for item in state[\"asked\"\
          ])\n        basic_question = \"\"\n        if clear_direction and duration_unknown and not duration_asked and count\
          \ < 3 and urgency not in [\"emergency\", \"urgent\"] and \"复诊\" not in complaint:\n            basic_question =\
          \ \"这种不舒服持续多久了？\"\n            if specialty == \"ent\" and re.search(r\"耳鸣|嗡嗡|耳朵.*响\", complaint):\n           \
          \     associated = str(fields.get(\"associated\") or \"\")\n                hearing_known = bool(re.search(r\"听力|听不见|耳聋\"\
          , associated))\n                basic_question = \"耳鸣多久了？\" if hearing_known else \"耳鸣多久了？有没有突然听力下降？\"\n       \
          \ if urgency == \"emergency\" or (red_flags == \"present\" and urgency != \"urgent\"):\n            stage = \"emergency\"\
          \n            questions = []\n        elif not ids or not cited:\n            stage = \"fallback\"\n           \
          \ questions = []\n        elif basic_question:\n            stage = \"ask\"\n            questions = [basic_question]\n\
          \            count += 1\n            state[\"asked\"] = (state[\"asked\"] + questions)[-9:]\n        elif clear_direction\
          \ and not (questions and purpose == \"urgency\" and urgency == \"undetermined\"):\n            stage = \"recommend\"\
          \n            questions = []\n        elif count < 3 and (questions or not complaint or any(word in complaint for\
          \ word in [\"unknown\", \"未知\", \"不舒服\", \"说不清\", \"未提供\"])):\n            stage = \"ask\"\n            questions\
          \ = (questions or [\"主要哪里不舒服？\"] )[:1]\n            count += 1\n            state[\"asked\"] = (state[\"asked\"\
          ] + questions)[-9:]\n        else:\n            stage = \"recommend\"\n            questions = []\n            if\
          \ not clear_direction:\n                specialty = \"general\"\n                confidence = \"low\"\n        #\
          \ Localized specialist complaints retain their department; age is not a universal gate.\n        if stage == \"\
          recommend\" and specialty == \"respiratory\" and age is not None and age < 14:\n            specialty = \"pediatrics\"\
          \n        state.update(stage=stage, specialty_code=specialty, rounds=count)\n        if stage == \"recommend\":\n\
          \            state[\"phase\"] = \"booking_preferences\"\n        elif stage == \"emergency\":\n            state[\"\
          phase\"] = \"emergency\"\n        result.update(stage=stage, summary=summary, profile=fields, questions=questions,\
          \ specialty_code=specialty,\n                      urgency=urgency, knowledge_ids=cited, rationale=str(model.get(\"\
          rationale\", \"\"))[:500],\n                      possible_causes=[], department_confidence=confidence)\n      \
          \  if stage == \"emergency\":\n            result[\"message\"] = \"请尽快去就近医院急诊，必要时拨打120，不要等待门诊预约。\"\n        elif\
          \ stage == \"ask\":\n            result[\"message\"] = \"\"\n        elif stage == \"recommend\":\n            result[\"\
          message\"] = \"\" if urgency != \"urgent\" else \"建议今天到医院就诊，不要等几天后的预约。\"\n    except (ValueError, TypeError, KeyError):\n\
          \        state[\"stage\"] = \"fallback\"\n    result.update(_state=state, _model_output=text, _knowledge=knowledge)\n\
          \    return {\"stage\": result[\"stage\"], \"profile_json\": json.dumps(state, ensure_ascii=False), \"rounds\":\
          \ count,\n            \"result_json\": json.dumps(result, ensure_ascii=False), \"specialty\": result.get(\"specialty_code\"\
          , \"general\")}\n\n\n"
        code_language: python3
