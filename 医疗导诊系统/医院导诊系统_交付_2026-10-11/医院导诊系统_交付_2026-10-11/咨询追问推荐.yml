    - data:
        code: "import json\nfrom datetime import datetime\n\nLABELS = {\"general\"\
          : \"全科门诊\", \"digestive\": \"消化内科\", \"respiratory\": \"呼吸内科\", \"neurology\"\
          : \"神经内科\", \"orthopedic\": \"骨科\", \"gynecology\": \"妇产科\", \"pediatrics\"\
          : \"儿科\", \"ent\": \"耳鼻喉科\", \"dermatology\": \"皮肤科\", \"endocrine\": \"\
          内分泌科\", \"cardiac\": \"心血管内科\", \"surgery\": \"外科\"}\nENUMS = {\"registration_type\"\
          : {\"expert\", \"ordinary\", \"any\", \"unknown\"}, \"period\": {\"morning\"\
          , \"afternoon\", \"any\", \"unknown\"}, \"priority\": {\"type\", \"time\"\
          , \"doctor\", \"flexible\", \"unknown\"}}\n\n\ndef date_of(slot: dict) ->\
          \ str:\n    return slot[\"starts_at\"][:10]\n\n\ndef period_of(slot: dict)\
          \ -> str:\n    return \"morning\" if int(slot[\"starts_at\"][11:13]) < 12\
          \ else \"afternoon\"\n\n\ndef matches(slot: dict, prefs: dict, ignore: set\
          \ | None = None) -> bool:\n    ignored = ignore or set()\n    values = {\"\
          registration_type\": slot[\"registration_type\"], \"period\": period_of(slot),\
          \ \"date\": date_of(slot), \"doctor_id\": slot[\"doctor_id\"]}\n    return\
          \ all(key in ignored or not prefs.get(key) or prefs[key] in [\"unknown\"\
          , \"any\"] or prefs[key] == value for key, value in values.items())\n\n\n\
          def slot_text(slot: dict) -> str:\n    moment = datetime.fromisoformat(slot[\"\
          starts_at\"])\n    period = \"上午\" if moment.hour < 12 else \"下午\"\n   \
          \ kind = \"专家号\" if slot[\"registration_type\"] == \"expert\" else \"普通号\"\
          \n    hospital = str(slot.get(\"hospital_name\", \"\")).split(\"市\")[-1]\n\
          \    venue = \"，\" + hospital if hospital else \"\"\n    return f\"{moment.month}月{moment.day}日{period}{moment:%H:%M}，{slot['doctor_name']}，{kind}{venue}\"\
          \n\n\ndef diverse_slots(slots: list[dict]) -> list[dict]:\n    chosen =\
          \ []\n    groups = set()\n    for slot in slots:\n        group = (date_of(slot),\
          \ period_of(slot), slot[\"registration_type\"], slot[\"doctor_id\"])\n \
          \       if group not in groups:\n            chosen.append(slot)\n     \
          \       groups.add(group)\n        if len(chosen) == 3:\n            break\n\
          \    for slot in slots:\n        if len(chosen) == 3:\n            break\n\
          \        if not any(item[\"slot_id\"] == slot[\"slot_id\"] for item in chosen):\n\
          \            chosen.append(slot)\n    return chosen\n\n\ndef main(text:\
          \ str, context: str, options_body: str) -> dict:\n    source = json.loads(context)\n\
          \    state = source.get(\"state\", {})\n    clinical = dict(source.get(\"\
          result\", state.get(\"clinical_result\", {})))\n    clinical.pop(\"booking_payload\"\
          , None)\n    state[\"clinical_result\"] = dict(clinical)\n    first_booking_turn\
          \ = not state.get(\"booking_started\")\n    state[\"booking_started\"] =\
          \ True\n    result = dict(clinical)\n    result[\"schema_version\"] = \"\
          2.0\"\n    result[\"booking_payload\"] = None\n    result[\"questions\"\
          ] = []\n    answer = \"\"\n    catalog = {}\n    try:\n        changes =\
          \ json.loads(text)\n        if not isinstance(changes, dict):\n        \
          \    raise ValueError(\"偏好格式不正确\")\n        catalog = json.loads(options_body)\n\
          \        if not catalog.get(\"ok\"):\n            raise ValueError(\"无法查询档期\"\
          )\n        doctors = catalog[\"doctors\"]\n        doctor_ids = {doctor[\"\
          id\"] for doctor in doctors}\n        result[\"recommended_doctors\"] =\
          \ [{\"doctor_id\": doctor[\"id\"], \"doctor_name\": doctor[\"name\"], **doctor}\
          \ for doctor in doctors]\n        specialty = result.get(\"specialty_code\"\
          , state.get(\"specialty_code\", \"general\"))\n        result[\"department_recommendation\"\
          ] = LABELS.get(specialty, \"全科门诊\")\n        intro = \"\"\n        if first_booking_turn:\n\
          \            intro = \"建议挂\" + result[\"department_recommendation\"] + \"\
          。\"\n            if specialty == \"general\":\n                intro = \"\
          暂时难判断具体科室，建议先挂全科门诊，再由医生分诊。\"\n        prefs = dict(state.get(\"preferences\"\
          , {}))\n        if changes.get(\"intent\") == \"change\":\n            state.pop(\"\
          selected_slot\", None)\n        for key, choices in ENUMS.items():\n   \
          \         if changes.get(key) in choices and changes[key] != \"unknown\"\
          :\n                prefs[key] = changes[key]\n        date = changes.get(\"\
          date\")\n        if date == \"any\":\n            prefs[\"date\"] = date\n\
          \        elif isinstance(date, str) and len(date) == 10:\n            datetime.strptime(date,\
          \ \"%Y-%m-%d\")\n            prefs[\"date\"] = date\n        doctor = changes.get(\"\
          doctor_id\")\n        if isinstance(doctor, int) and not isinstance(doctor,\
          \ bool):\n            if doctor == 0:\n                prefs.pop(\"doctor_id\"\
          , None)\n            elif doctor in doctor_ids:\n                prefs[\"\
          doctor_id\"] = doctor\n            else:\n                answer = \"这个科室没有您说的医生，请换一位或让我列出可选医生。\"\
          \n        state[\"preferences\"] = prefs\n        result[\"preferences\"\
          ] = prefs\n        slots = [slot for slot in catalog[\"slots\"] if slot[\"\
          doctor_id\"] in doctor_ids]\n        slots.sort(key=lambda slot: (slot[\"\
          starts_at\"], slot[\"doctor_id\"]))\n        if result.get(\"urgency\")\
          \ == \"urgent\":\n            answer = \"建议今天到医院就诊，先到导诊台咨询，不要等之后的预约。\"\n\
          \            result[\"stage\"] = \"urgent\"\n        elif changes.get(\"\
          intent\") == \"stop\":\n            answer = \"好的，先不预约。需要时可以继续告诉我想选的医生和时间。\"\
          \n            result[\"stage\"] = \"booking_preferences\"\n            state.pop(\"\
          selected_slot\", None)\n        elif not answer:\n            selection\
          \ = changes.get(\"selection\")\n            offered = state.get(\"offered_slots\"\
          , [])\n            selected = None\n            lost_slot = False\n    \
          \        if selection is None and changes.get(\"intent\") == \"choose\"\
          \ and len(offered) == 1:\n                explicit_changes = {key: prefs[key]\
          \ for key in [\"date\", \"period\", \"registration_type\", \"doctor_id\"\
          ] if key in changes and key in prefs and changes[key] not in [None, \"unknown\"\
          ]}\n                if matches(offered[0], explicit_changes):\n        \
          \            selection = 1\n            if isinstance(selection, int) and\
          \ not isinstance(selection, bool) and 1 <= selection <= len(offered):\n\
          \                wanted = offered[selection - 1]\n                selected\
          \ = next((slot for slot in slots if slot[\"slot_id\"] == wanted[\"slot_id\"\
          ]), None)\n                lost_slot = selected is None\n              \
          \  explicit_changes = {key: prefs[key] for key in [\"date\", \"period\"\
          , \"registration_type\", \"doctor_id\"] if key in changes and key in prefs\
          \ and changes[key] not in [None, \"unknown\"]}\n                if selected\
          \ and not matches(selected, explicit_changes):\n                    selected\
          \ = None\n            elif state.get(\"selected_slot\") and changes.get(\"\
          intent\") != \"change\" and not any(key in changes and changes[key] not\
          \ in [None, \"unknown\"] for key in [\"date\", \"period\", \"registration_type\"\
          , \"doctor_id\"]):\n                selected = next((slot for slot in slots\
          \ if slot[\"slot_id\"] == state[\"selected_slot\"][\"slot_id\"]), None)\n\
          \                lost_slot = selected is None\n            if selected:\n\
          \                if state.get(\"selected_slot\", {}).get(\"slot_id\") !=\
          \ selected[\"slot_id\"]:\n                    state.pop(\"handover_request_id\"\
          , None)\n                state[\"selected_slot\"] = selected\n         \
          \       prefs.update(registration_type=selected[\"registration_type\"],\
          \ date=date_of(selected), period=period_of(selected), doctor_id=selected[\"\
          doctor_id\"])\n                result.update(stage=\"booking_ready\", selected_slot=selected,\
          \ preferences=prefs,\n                              booking_payload={\"\
          action\": \"hold\", \"doctor_id\": str(selected[\"doctor_id\"]), \"slot_id\"\
          : selected[\"slot_id\"], \"appointment_id\": \"\", \"request_id\": \"\"\
          , \"patient_token\": \"\"})\n                answer = \"已选\" + slot_text(selected)\
          \ + \"。请点击“预约”提交，提交后才会保留号源。\"\n            else:\n                state.pop(\"\
          selected_slot\", None)\n                state.pop(\"handover_request_id\"\
          , None)\n                result.pop(\"selected_slot\", None)\n         \
          \       missing = [\"想哪天就诊？\"] if prefs.get(\"date\", \"unknown\") == \"\
          unknown\" else []\n                if missing and not lost_slot:\n     \
          \               result[\"stage\"] = \"recommend\" if first_booking_turn\
          \ else \"booking_preferences\"\n                    result[\"questions\"\
          ] = missing[:2]\n                    answer = intro + \"\".join(missing[:2])\n\
          \                    state[\"offered_slots\"] = []\n                else:\n\
          \                    exact = [slot for slot in slots if matches(slot, prefs)]\n\
          \                    candidates = diverse_slots(exact)\n               \
          \     changed = not candidates\n                    if changed:\n      \
          \                  priority = prefs.get(\"priority\", \"unknown\")\n   \
          \                     if priority in [\"type\", \"doctor\"]:\n         \
          \                   candidates = [slot for slot in slots if matches(slot,\
          \ prefs, {\"date\", \"period\"})][:3]\n                        elif priority\
          \ == \"time\":\n                            candidates = [slot for slot\
          \ in slots if matches(slot, prefs, {\"registration_type\", \"doctor_id\"\
          })][:3]\n                        else:\n                            keep_type\
          \ = [slot for slot in slots if matches(slot, prefs, {\"date\", \"period\"\
          })]\n                            keep_time = [slot for slot in slots if\
          \ matches(slot, prefs, {\"registration_type\", \"doctor_id\"})]\n      \
          \                      candidates = ([keep_type[0]] if keep_type else [])\
          \ + ([keep_time[0]] if keep_time else [])\n                            same_period\
          \ = [slot for slot in keep_type if period_of(slot) == prefs.get(\"period\"\
          )]\n                            candidates += same_period[:1]\n        \
          \                    seen = set()\n                            candidates\
          \ = [slot for slot in candidates if not (slot[\"slot_id\"] in seen or seen.add(slot[\"\
          slot_id\"]))][:3]\n                            if not candidates:\n    \
          \                            candidates = slots[:3]\n                  \
          \  state[\"offered_slots\"] = candidates\n                    result.update(stage=\"\
          booking_options\", options=candidates, exact_match=not changed)\n      \
          \              if candidates:\n                        prefix = \"这个时段刚被占用了，请再选：\"\
          \ if lost_slot else (\"这个科室目前只有普通号，可选：\" if prefs.get(\"registration_type\"\
          ) == \"expert\" and not any(doctor.get(\"registration_type\") == \"expert\"\
          \ for doctor in doctors) else \"符合要求的号已约满，可改选：\") if changed else \"可选：\"\
          \n                        answer = intro + prefix + \"\\n\" + \"\\n\".join(f\"\
          {index}. {slot_text(slot)}\" for index, slot in enumerate(candidates, 1))\
          \ + \"\\n您选哪个？也可以调整号别或时间。\"\n                    else:\n               \
          \         answer = intro + \"暂时没有符合要求的号源。要换个日期，还是调整普通号／专家号？\"\n        if\
