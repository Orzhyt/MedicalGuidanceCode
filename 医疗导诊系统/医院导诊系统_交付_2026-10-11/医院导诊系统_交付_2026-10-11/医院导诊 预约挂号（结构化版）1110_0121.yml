    - data:
        code: "WEEK = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\
          \ndef week_of(d: str) -> str:\n    try:\n        from datetime import date\n\
          \        return WEEK[date.fromisoformat(d).weekday()]\n    except (ValueError,\
          \ TypeError):\n        return \"\"\n\n\ndef out(stage, reply, doctor_id,\
          \ slot_date, start_time, hospital_name, department_name, doctor_name):\n\
          \    return {\"stage\": stage, \"reply\": reply, \"doctor_id\": int(doctor_id\
          \ or 0), \"slot_date\": slot_date,\n            \"start_time\": start_time,\
          \ \"hospital_name\": hospital_name, \"department_name\": department_name,\n\
          \            \"doctor_name\": doctor_name}\n\n\ndef main(intent: str, doctor_id:\
          \ int, doctor_name: str, hospital_name: str, department_name: str,\n   \
          \      slot_date: str, period: str, question: str) -> dict:\n    intent\
          \ = intent or \"unknown\"\n    doctor_name = str(doctor_name or \"\")\n\
          \    hospital_name = str(hospital_name or \"\")\n    department_name = str(department_name\
          \ or \"\")\n    slot_date = str(slot_date or \"\")\n    period = period\
          \ or \"unknown\"\n    question = str(question or \"\")\n    if intent ==\
          \ \"cancel\":\n        return out(\"cancel\", \"好的，已取消本次预约操作。需要再约的话直接告诉我医生和时间。\"\
          , 0, \"\", \"\", \"\", \"\", \"\")\n    if doctor_id is None:\n        if\
          \ doctor_name:\n            return out(\"not_found\", question or \"抱歉，没在医生名单里找到您说的医生，请换个名字或让我列出可选医生。\"\
          ,\n                       0, \"\", \"\", hospital_name, department_name,\
          \ doctor_name)\n        return out(\"ask\", question or \"请问您想约哪位医生？可以说医生姓名、医院或科室。\"\
          , 0, \"\", \"\", \"\", \"\", \"\")\n    if not slot_date:\n        return\
          \ out(\"ask\", question or \"请问想约哪一天？\", doctor_id, \"\", \"\", hospital_name,\
          \ department_name, doctor_name)\n    if period not in (\"morning\", \"afternoon\"\
          ):\n        return out(\"ask\", question or \"请问想约上午还是下午？\", doctor_id,\
          \ slot_date, \"\", hospital_name, department_name, doctor_name)\n    if\
          \ intent != \"confirm\":\n        period_cn = \"上午\" if period == \"morning\"\
          \ else \"下午\"\n        reply = \"请确认：您要预约 {} · {} · {} 医生，{}（{}）{} 的号吗？回复“确认”即可。\"\
          .format(\n            hospital_name, department_name, doctor_name, slot_date,\
          \ week_of(slot_date), period_cn)\n        return out(\"confirm\", reply,\
          \ doctor_id, slot_date, \"\", hospital_name, department_name, doctor_name)\n\
          \    start_time = \"08:00:00\" if period == \"morning\" else \"14:00:00\"\
          \n    return out(\"book\", None, doctor_id, slot_date, start_time, hospital_name,\
          \ department_name, doctor_name)\n"
        code_language: python3
        desc: 基于结构化字段判断：追问/未找到/确认/预约/取消；无 JSON 解析。
