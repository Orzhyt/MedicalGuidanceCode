    - data:
        desc: 生成患者能直接看懂的提示。
        selected: false
        title: 准备急诊提示或重新咨询提示
        type: code
        code: "import json\n\ndef main(action: str, state_json: str, rounds: float) -> dict:\n    stage = \"reset\" if action\
          \ == \"reset\" else \"emergency\"\n    state = {} if stage == \"reset\" else json.loads(state_json)\n    state.update(stage=stage,\
          \ phase=\"clinical\" if stage == \"reset\" else \"emergency\", rounds=0 if stage == \"reset\" else int(rounds or\
          \ 0))\n    answer = \"好的，主要哪里不舒服？\" if stage == \"reset\" else \"请尽快去就近医院急诊，必要时拨打120，不要等待门诊预约。\"\n    result = {\"\
          schema_version\": \"2.0\", \"stage\": stage, \"message\": answer, \"questions\": [], \"recommended_doctors\": []}\n\
          \    return {\"envelope\": json.dumps({\"answer\": answer, \"result\": result, \"state\": state, \"model_output\"\
          : \"\", \"knowledge\": \"\"}, ensure_ascii=False)}\n"
        code_language: python3
        outputs:
          envelope:
            children: null
            type: string
        variables:
