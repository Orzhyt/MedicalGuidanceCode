    - data:
        desc: 合并之前的回答；识别重新咨询指令和明显需要急诊的情况。
        selected: false
        title: 整理已知信息，检查紧急情况
        type: code
        code: "import json\nimport re\n\n\ndef danger(text: str) -> bool:\n    clauses = re.split(r\"[，。；！？\\n]|但是|但|(?<!喘)不过\"\
          , text)\n    positive = []\n    for clause in clauses:\n        clause = re.sub(r\"(?:没有|否认|不伴|无(?!法|力))(?:(?!(?:突然|突发|出现|伴有|同时有|现在有|却)).)*\"\
          , \"\", clause)\n        positive.append(clause)\n    visible = \"，\".join(positive)\n    patterns = [\n       \
          \ r\"喘不过气|喘不上气|呼吸不上来|无法呼吸|严重呼吸困难|憋气|口唇发紫|意识不清|昏迷|晕厥|呕血|吐血|黑便|说话含糊|一侧.{0,5}无力\",\n        r\"(?:突然|突发).{0,6}(?:剧烈|严重).{0,5}(?:头痛|腹痛|胸痛)|(?:突然|突发).{0,5}(?:头痛|腹痛|胸痛).{0,6}(?:剧烈|严重)\"\
          ,\n        r\"大量.{0,5}出血|(?:发热|发烧).{0,6}抽搐\",\n    ]\n    if any(re.search(pattern, visible) for pattern in patterns):\n\
          \        return True\n    return bool(re.search(r\"胸.{0,4}(?:痛|闷|不适|不舒服)\", visible) and re.search(r\"冷汗|呼吸困难|喘不上|喘不过|气促|气短|憋气|晕\"\
          , visible))\n\n\ndef main(query: str, profile_json: str, rounds: float) -> dict:\n    try:\n        previous = json.loads(profile_json\
          \ or \"{}\")\n        if not isinstance(previous, dict):\n            previous = {}\n    except ValueError:\n  \
          \      previous = {}\n    query = query.strip()[:2500]\n    reset = query in [\"重新咨询\", \"开始新咨询\", \"清空咨询\"]\n \
          \   if reset:\n        previous = {}\n    history = list(previous.get(\"history\", []))[-4:]\n    history.append(query)\n\
          \    previous[\"history\"] = history\n    action = \"reset\" if reset else \"emergency\" if (danger(query) or previous.get(\"\
          stage\") == \"emergency\") else \"continue\"\n    if action == \"emergency\":\n        previous[\"stage\"] = \"\
          emergency\"\n    synonyms = []\n    for words, keyword in [\n        ([\"肚子\", \"胃\", \"反酸\", \"腹\", \"恶心\"], \"\
          腹痛 消化 digestive\"),\n        ([\"咳\", \"痰\", \"气喘\"], \"咳嗽 呼吸 respiratory\"),\n        ([\"头痛\", \"头晕\"], \"头痛 神经\
          \ neurology\"),\n        ([\"膝\", \"关节\", \"扭伤\", \"腰痛\"], \"关节 骨科 orthopedic\"),\n        ([\"孩子\", \"宝宝\", \"\
          岁小孩\"], \"儿童 儿科 pediatrics\"),\n        ([\"怀孕\", \"孕\", \"月经\"], \"妇产 gynecology\"),\n        ([\"喉\", \"鼻\", \"\
          耳\"], \"咽喉 ent\"),\n        ([\"皮疹\", \"痒\", \"皮肤\"], \"皮肤 dermatology\"),\n        ([\"血糖\", \"糖尿病\"], \"内分泌 endocrine\"\
          ),\n    ]:\n        if any(word in \" \".join(history) for word in words):\n            synonyms.append(keyword)\n\
          \    return {\n        \"action\": action,\n        \"context\": json.dumps(previous, ensure_ascii=False),\n   \
          \     \"knowledge_query\": \"导诊 追问 \" + \" \".join(synonyms) + \" \" + query + \" \" + str(previous.get(\"summary\"\
          , \"\")),\n        \"early_state\": json.dumps(previous if not reset else {}, ensure_ascii=False),\n        \"rounds\"\
          : 0 if reset else int(rounds or 0),\n    }\n"
        code_language: python3
        outputs:
          action:
            children: null
            type: string
          context:
            children: null
            type: string
          knowledge_query:
            children: null
            type: string
          early_state:
            children: null
            type: string
          rounds:
            children: null
            type: number
        variables:
        - value_selector:
          - sys
          - query
          value_type: string
          variable: query
        - value_selector:
          - conversation
          - profile_json
          value_type: string
          variable: profile_json
        - value_selector:
          - conversation
          - rounds
          value_type: number
          variable: rounds
      height: 120
      id: precheck
      position:
        x: 300
        y: 400
      positionAbsolute:
        x: 300
        y: 400
      sourcePosition: right
      targetPosition: left
      type: custom
