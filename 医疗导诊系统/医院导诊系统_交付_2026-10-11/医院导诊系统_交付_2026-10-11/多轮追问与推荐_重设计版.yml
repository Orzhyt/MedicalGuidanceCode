    - data:
        desc: 按科室筛选医生并生成推荐文案；不生成预约。
        selected: false
        title: 生成科室与医生推荐
        type: code
        code: "import json\n\nLABELS = {\"general\": \"全科门诊\", \"digestive\": \"消化内科\", \"respiratory\": \"呼吸内科\", \"neurology\"\
          : \"神经内科\", \"orthopedic\": \"骨科\", \"gynecology\": \"妇产科\", \"pediatrics\": \"儿科\", \"ent\": \"耳鼻喉科\", \"dermatology\"\
          : \"皮肤科\", \"endocrine\": \"内分泌科\", \"cardiac\": \"心血管内科\", \"surgery\": \"外科\"}\nKEYWORDS = {\n    \"general\"\
          : [\"内科\", \"全科\"],\n    \"digestive\": [\"消化\", \"胃肠\"],\n    \"respiratory\": [\"呼吸\", \"肺\"],\n    \"neurology\"\
          : [\"神经\", \"脑血管\", \"头痛\", \"癫痫\"],\n    \"orthopedic\": [\"骨科\", \"关节\", \"脊柱\", \"创伤\"],\n    \"gynecology\"\
          : [\"妇产\", \"产科\", \"妇科\"],\n    \"pediatrics\": [\"儿科\", \"儿童\", \"儿保\"],\n    \"ent\": [\"耳鼻喉\", \"耳\", \"鼻\"\
          , \"咽喉\"],\n    \"dermatology\": [\"皮肤\", \"皮疹\"],\n    \"endocrine\": [\"内分泌\", \"糖尿\", \"甲状腺\"],\n    \"cardiac\"\
          : [\"心血管\", \"心内\"],\n    \"surgery\": [\"外科\", \"普外\", \"泌尿\"],\n}\n\n\ndef doctor_line(doc: dict) -> str:\n  \
          \  parts = [str(doc.get(\"hospital_name\") or \"\"), str(doc.get(\"department_name\") or \"\"), str(doc.get(\"name\"\
          ) or \"\")]\n    line = \" · \".join(part for part in parts if part)\n    title = str(doc.get(\"title\") or \"\"\
          )\n    specialty = str(doc.get(\"specialty\") or \"\")\n    if title or specialty:\n        suffix = \"，\".join(item\
          \ for item in [title, \"擅长\" + specialty if specialty else \"\"] if item)\n        line += \"（\" + suffix + \"）\"\
          \n    return line\n\n\ndef main(result_json: str, catalog_context: str) -> dict:\n    result = json.loads(result_json)\n\
          \    state = result.pop(\"_state\", {})\n    model_output = result.pop(\"_model_output\", \"\")\n    knowledge =\
          \ result.pop(\"_knowledge\", \"\")\n    try:\n        compact = json.loads(catalog_context or \"{}\")\n    except\
          \ ValueError:\n        compact = {}\n    doctors = list((compact.get(\"doctors\") or []))\n    specialty = result.get(\"\
          specialty_code\", state.get(\"specialty_code\", \"general\"))\n    keywords = KEYWORDS.get(specialty, KEYWORDS[\"\
          general\"])\n    matched = []\n    for doc in doctors:\n        haystack = str(doc.get(\"specialty\") or \"\") +\
          \ \" \" + str(doc.get(\"department_name\") or \"\")\n        if any(keyword in haystack for keyword in keywords):\n\
          \            matched.append(doc)\n    matched = matched[:3]\n    result[\"recommended_doctors\"] = matched\n   \
          \ department = LABELS.get(specialty, \"全科门诊\")\n    result[\"department_recommendation\"] = department\n    intro\
          \ = \"建议挂\" + department + \"。\"\n    if specialty == \"general\":\n        intro = \"暂时难判断具体科室，建议先挂全科门诊，再由医生分诊。\"\
          \n    if matched:\n        lines = [doctor_line(doc) for doc in matched]\n        answer = intro + \"可考虑的医生：\" +\
          \ \"；\".join(lines) + \"。本服务不直接挂号，请通过医院公众号、挂号平台或窗口办理。\"\n    else:\n        answer = intro + \"目前没有检索到对口医生，请到医院导诊台或挂号平台查询。\"\
          \n    if result.get(\"urgency\") == \"urgent\":\n        answer = \"建议今天到医院就诊，先到导诊台咨询，不要等几天后的预约。\" + answer\n  \
          \  state.update(stage=\"recommend\", phase=\"recommend\")\n    envelope = {\"answer\": answer, \"result\": result,\
          \ \"state\": state, \"model_output\": model_output, \"knowledge\": knowledge, \"availability\": compact}\n    return\
          \ {\"answer\": answer, \"envelope\": json.dumps(envelope, ensure_ascii=False)}\n"
        code_language: python3
        outputs:
          answer:
            children: null
            type: string
          envelope:
            children: null
            type: string
