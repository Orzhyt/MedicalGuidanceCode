  <text x="340" y="422" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" fill-opacity="0.35" font-size="10">Day 1: Dify=Mock（假数据） → Day 2: Dify=真实工作流（LLM+HTTP调挂号系统） → 联调: Mock替换为Dify</text>
